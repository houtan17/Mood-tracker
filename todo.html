<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لیست کارها</title>

    <!-- ===== PWA ===== -->
    <link rel="manifest" href="manifest.json" />

    <!-- Browser UI color (matches --primary in variables.css) -->
    <meta name="theme-color" content="#5b7cfa" />

    <!-- iOS: install as standalone app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="لیست کارها" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Generic favicon (reuses the PWA icon) -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />

    <!-- Font (falls back to system fonts when offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Styles: order matters (variables first) -->
    <!-- Apply saved/auto theme before first paint (no flash) -->
    <script>
      (function () {
        var theme = "light";
        try {
          var data = JSON.parse(localStorage.getItem("moodTracker.v1") || "{}");
          var mode = data && data.settings && data.settings.theme;
          if (mode === "light" || mode === "dark") {
            theme = mode;
          } else {
            var h = new Date().getHours();
            theme = h >= 6 && h < 18 ? "light" : "dark"; // sunset estimate
          }
        } catch (e) {
          /* keep light */
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/todo.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CWVQMFX1BG"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-CWVQMFX1BG");
    </script>
  </head>
  <body>
    <!-- ===== Header ===== -->
    <header class="app-header">
      <div class="header-inner">
        <a class="btn btn-ghost back-btn" href="index.html">→ بازگشت</a>
        <h1 class="app-title">لیست کارها</h1>
        <div class="header-actions">
          <button class="btn btn-ghost icon-btn" id="themeToggle">🌓</button>
        </div>
      </div>
    </header>

    <!-- ===== Main ===== -->
    <main class="container">
      <section class="card todo-card">
        <form class="todo-add-form" id="todoAddForm">
          <input
            type="text"
            class="todo-input"
            id="todoInput"
            maxlength="200"
            placeholder="یک کار جدید بنویس..."
            autocomplete="off"
          />
          <button type="submit" class="btn btn-primary todo-add-btn">
            ＋ افزودن
          </button>
        </form>

        <p class="todo-count" id="todoCount"></p>

        <ul class="todo-list" id="todoList"></ul>

        <div class="todo-empty hidden" id="todoEmpty">
          <span class="todo-empty-emoji" aria-hidden="true">🗒️</span>
          <p>هنوز کاری اضافه نشده.<br />اولین کارت رو بنویس!</p>
        </div>
      </section>
    </main>

    <!-- ===== Toast holder ===== -->
    <div class="toast-holder" id="toastHolder"></div>

    <!-- Scripts: order matters -->
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/todo.js"></script>

    <!-- ===== PWA: register the service worker + update toast ===== -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("sw.js")
            .then((reg) => {
              reg.addEventListener("updatefound", () => {
                var nw = reg.installing;
                if (!nw) return;
                nw.addEventListener("statechange", () => {
                  /* Announce only when a NEW version takes over an
                     already-controlled page (not on first install) */
                  if (
                    nw.state === "activated" &&
                    navigator.serviceWorker.controller
                  ) {
                    showUpdateToast();
                  }
                });
              });
            })
            .catch((err) =>
              console.error("Service Worker registration failed:", err),
            );
        });
      }

      function showUpdateToast() {
        var holder = document.getElementById("toastHolder");
        if (!holder) return;
        holder.innerHTML = "";
        var box = document.createElement("div");
        box.className = "toast-box";
        box.textContent = "به‌روزرسانی جدید نصب شد ✨";
        holder.appendChild(box);
      }
    </script>
  </body>
</html>
