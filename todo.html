<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تولدها 🥳</title>

    <!-- ===== PWA ===== -->
    <link rel="manifest" href="manifest.json" />

    <!-- Browser UI color (matches --primary in variables.css) -->
    <meta name="theme-color" content="#5b7cfa" />

    <!-- iOS: install as standalone app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="تولدها" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Generic favicon (reuses the PWA icon) -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />

    <!-- Font (falls back to system fonts when offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Styles: order matters (variables first).
         Analytics lives in js/pwa.js (single copy). -->
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/birthdays.css" />
    <link rel="stylesheet" href="css/home.css" />

  </head>
  <body class="bday-page">
    <!-- ===== Header ===== -->
    <header class="app-header">
      <div class="header-inner">
        <a class="btn btn-ghost back-btn" href="index.html">→ بازگشت</a>
        <h1 class="app-title">تولدها رو فراموش نکن 🥳🥳</h1>
        <div class="header-actions">
          <button class="btn btn-ghost icon-btn" id="themeToggle">🌓</button>
        </div>
      </div>
    </header>

    <!-- ===== Main ===== -->
    <main class="container">
      <section class="card bday-card">
        <form class="bday-add-form" id="bdayAddForm">
          <input
            type="text"
            class="bday-input"
            id="bdayName"
            maxlength="40"
            placeholder="اسم شخص..."
            autocomplete="off"
          />
          <div class="bday-date-row">
            <select class="bday-select" id="bdayDay" aria-label="روز"></select>
            <select class="bday-select" id="bdayMonth" aria-label="ماه"></select>
            <select class="bday-select" id="bdayYear" aria-label="سال"></select>
          </div>
          <button type="submit" class="btn btn-primary bday-add-btn" id="bdayAddBtn">
            ＋ افزودن
          </button>
        </form>

        <p class="bday-preview" id="bdayPreview"></p>

        <p class="bday-count" id="bdayCount"></p>

        <div class="bday-list" id="bdayList"></div>

        <div class="bday-empty hidden" id="bdayEmpty">
          <span class="bday-empty-emoji" aria-hidden="true">🎂</span>
          <p>هنوز تولدی اضافه نشده.<br />اولین تولد رو اضافه کن!</p>
        </div>
      </section>
    </main>

    <!-- ===== Bottom Navigation Bar (mobile only) ===== -->
    <nav class="bottom-nav" aria-label="ناوبری اصلی">
      <a class="nav-item active" href="todo.html" aria-current="page">
        <span class="nav-ico" aria-hidden="true">🥳</span>
        <span class="nav-label">تولدها</span>
      </a>
      <a class="nav-item" href="index.html#dashboard">
        <span class="nav-ico" aria-hidden="true">📊</span>
        <span class="nav-label">داشبورد</span>
      </a>
      <a class="nav-item" href="index.html#home">
        <span class="nav-ico" aria-hidden="true">📅</span>
        <span class="nav-label">خانه</span>
      </a>
      <a class="nav-item" href="index.html#year">
        <span class="nav-ico" aria-hidden="true">🎯</span>
        <span class="nav-label">شمارنده</span>
      </a>
      <a class="nav-item" href="index.html#todo">
        <span class="nav-ico" aria-hidden="true">✅</span>
        <span class="nav-label">کارها</span>
      </a>
    </nav>

    <!-- ===== Toast holder ===== -->
    <div class="toast-holder" id="toastHolder"></div>

    <!-- Scripts: order matters -->
    <script src="js/jalali.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/birthdays.js"></script>

    <script src="js/pwa.js"></script>
  </body>
</html>
