<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت حال روزانه</title>

    <!-- ===== PWA ===== -->
    <link rel="manifest" href="manifest.json" />

    <!-- Browser UI color (matches --primary in variables.css) -->
    <meta name="theme-color" content="#5b7cfa" />

    <!-- iOS: install as standalone app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="حال روزانه" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Generic favicon (reuses the PWA icon) -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />

    <!-- Font (falls back to system fonts when offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Styles: order matters (variables first).
         Analytics lives in js/pwa.js (single copy). -->
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/todo.css" />
    <link rel="stylesheet" href="css/birthdays.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/auth.css" />

  </head>
  <body data-view="home">
    <!-- ===== Header ===== -->
    <header class="app-header">
      <div class="header-inner">
        <!-- Left zone: Login button / user chip. Physical left in both
             FA (rtl) and EN (ltr) — the container direction is forced ltr. -->
        <div class="header-zone header-left">
          <div class="auth-area hidden" id="authArea">
            <button class="btn btn-primary auth-login-btn hidden" id="authLoginBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span id="authLoginLabel">ورود</span>
            </button>
            <div class="user-chip-wrap hidden" id="userChipWrap">
              <button class="user-chip" id="userChip" type="button" aria-haspopup="menu" aria-expanded="false">
                <span class="user-avatar" id="userAvatar" aria-hidden="true">•</span>
                <span class="user-name" id="userChipName"></span>
                <svg class="user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="user-menu hidden" id="userMenu" role="menu" aria-label="account menu">
                <div class="user-menu-head">
                  <span class="user-menu-name" id="userMenuName"></span>
                  <span class="user-menu-email" id="userMenuEmail"></span>
                </div>
                <div class="user-menu-sync">
                  <span class="sync-dot" id="syncDot" aria-hidden="true"></span>
                  <span id="syncStatusText"></span>
                </div>
                <div class="user-menu-sep"></div>
                <button class="user-menu-item" id="syncNowBtn" type="button" role="menuitem">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                  <span id="syncNowLabel">همگام‌سازی الان</span>
                </button>
                <button class="user-menu-item" id="changePassBtn" type="button" role="menuitem">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  <span id="changePassLabel">تغییر رمز عبور</span>
                </button>
                <button class="user-menu-item user-menu-logout" id="logoutBtn" type="button" role="menuitem">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                  <span id="logoutLabel">خروج از حساب</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Center zone: title + greeting, centered (greeting below title) -->
        <div class="header-center">
          <h1 class="app-title" id="appTitle">ثبت حال روزانه</h1>
          <button class="greet-btn hidden" id="greetBtn">
            <span id="greetText"></span>
          </button>
        </div>

        <!-- Right zone: dashboard / streak / language switcher.
             Language switcher is the rightmost element and the streak
             badge sits right next to it. -->
        <div class="header-zone header-right">
          <button class="btn btn-ghost" id="dashboardBtn" type="button">داشبورد</button>
          <div class="streak-badge" id="streakBadge" role="status"></div>
          <button class="btn btn-ghost" id="langToggle">EN</button>
        </div>
      </div>
    </header>

    <!-- ===== Main ===== -->
    <main class="container container-wide">
      <div class="home-layout">
        <!-- ===== Left panel: Year Counter ===== -->
        <aside class="card panel panel-year" id="yearPanel">
          <div class="panel-head">
            <h2 class="panel-title" id="yearTitle">شمارنده سال</h2>
            <span class="year-value" id="yearValue"></span>
          </div>
          <div class="year-grid" id="yearGrid" aria-hidden="true"></div>
          <div class="year-footer">
            <span class="year-stat year-stat-passed" id="yearPassed"></span>
            <span class="year-pct" id="yearPct"></span>
            <span class="year-stat year-stat-left" id="yearLeft"></span>
          </div>
        </aside>

        <!-- ===== Center: calendar (home view) ===== -->
        <div class="home-center" id="viewHome">
          <section class="card">
            <div class="calendar-header">
              <button class="nav-btn" id="prevMonthBtn" aria-label="prev">‹</button>
              <h2 class="month-title" id="monthTitle"></h2>
              <button class="nav-btn" id="nextMonthBtn" aria-label="next">›</button>
            </div>

            <div class="today-wrap">
              <button class="btn btn-primary today-btn" id="todayBtn">امروز</button>
            </div>

            <div class="weekday-row" id="weekdayRow"></div>
            <div class="days-grid" id="daysGrid"></div>

            <div class="mood-legend" id="moodLegend"></div>
          </section>
        </div>

        <!-- ===== Right panel: To-Do List ===== -->
        <aside class="card panel panel-todo" id="todoPanel">
          <div class="panel-head">
            <h2 class="panel-title" id="todoPanelTitle">لیست کارها</h2>
          </div>
          <form class="todo-add-form" id="todoAddForm">
            <input
              type="text"
              class="todo-input"
              id="todoInput"
              maxlength="200"
              placeholder="یک کار جدید بنویس..."
              autocomplete="off"
            />
            <button type="submit" class="btn btn-primary todo-add-btn" id="todoAddBtn">
              ＋ افزودن
            </button>
          </form>

          <p class="todo-count" id="todoCount"></p>

          <ul class="todo-list" id="todoList"></ul>

          <div class="todo-empty hidden" id="todoEmpty">
            <span class="todo-empty-emoji" aria-hidden="true">🗒️</span>
            <p>هنوز کاری اضافه نشده.</p>
          </div>
        </aside>
      </div>

      <!-- ===== Dashboard view (embedded former dashboard page) ===== -->
      <section id="viewDashboard">
        <!-- Back to home (desktop; mobile uses the bottom nav) -->
        <div class="dash-topbar">
          <button class="btn btn-ghost back-btn" id="dashBackBtn" type="button">→ بازگشت</button>
        </div>

        <!-- Profile -->
        <section class="card dash-card">
          <h2 class="section-title" id="profileTitle">پروفایل من</h2>
          <div class="profile-form">
            <label class="field field-name">
              <span class="field-label" id="nameLabel">نام</span>
              <input type="text" class="text-input" id="dashNameInput" maxlength="30" autocomplete="name" />
            </label>
            <label class="field field-age">
              <span class="field-label" id="ageLabel">سن</span>
              <input type="number" class="text-input" id="ageInput" min="1" max="120" inputmode="numeric" />
            </label>
            <label class="field field-interests">
              <span class="field-label" id="interestsLabel">علاقه‌مندی‌ها</span>
              <input type="text" class="text-input" id="interestsInput" maxlength="120" />
            </label>
          </div>
          <div class="card-actions">
            <button class="btn btn-primary" id="saveProfileBtn">ذخیره پروفایل</button>
          </div>
        </section>

        <!-- Stats -->
        <div class="stats-grid">
          <section class="card stat-card">
            <h3 class="stat-title" id="moodTodayTitle">حال امروز</h3>
            <div class="stat-body" id="moodTodayValue"></div>
          </section>
          <section class="card stat-card">
            <h3 class="stat-title" id="notesTitle">یادداشت‌ها</h3>
            <div class="stat-body" id="notesValue"></div>
          </section>
          <section class="card stat-card">
            <h3 class="stat-title" id="tasksTitle">کارها</h3>
            <div class="stat-body" id="tasksValue"></div>
          </section>
          <section class="card stat-card">
            <h3 class="stat-title" id="avgTitle">میانگین حال</h3>
            <div class="stat-body" id="avgValue"></div>
          </section>
        </div>

        <!-- Weekly report -->
        <section class="card dash-card">
          <h2 class="section-title" id="weeklyTitle">گزارش هفتگی</h2>
          <div class="week-grid" id="weekGrid"></div>
          <div class="week-summary" id="weekSummary"></div>
        </section>

        <!-- Themes: light / dark / automatic -->
        <section class="card dash-card">
          <h2 class="section-title" id="themesTitle">پوسته</h2>
          <div class="theme-options" id="themeOptions">
            <button type="button" class="btn theme-opt" data-theme-mode="light">☀️ روشن</button>
            <button type="button" class="btn theme-opt" data-theme-mode="dark">🌙 تیره</button>
            <button type="button" class="btn theme-opt" data-theme-mode="auto">🌓 خودکار</button>
          </div>
        </section>
      </section>

      <!-- ===== Birthdays view (embedded former birthdays page) ===== -->
      <section id="viewBirthdays">
        <section class="card bday-card">
          <!-- Back to home (desktop; mobile uses the bottom nav) -->
          <div class="bday-topbar">
            <button class="btn btn-ghost back-btn" id="bdayBackBtn" type="button">→ بازگشت</button>
          </div>

          <div class="panel-head">
            <h2 class="panel-title" id="bdayTitle">تولدها</h2>
          </div>

          <form class="bday-add-form" id="bdayAddForm">
            <input
              type="text"
              class="bday-input"
              id="bdayName"
              maxlength="40"
              placeholder="اسم شخص..."
              autocomplete="off"
            />
            <div class="bday-date-row">
              <select class="bday-select" id="bdayDay" aria-label="روز"></select>
              <select class="bday-select" id="bdayMonth" aria-label="ماه"></select>
              <select class="bday-select" id="bdayYear" aria-label="سال"></select>
            </div>
            <button type="submit" class="btn btn-primary bday-add-btn" id="bdayAddBtn">
              ＋ افزودن
            </button>
          </form>

          <p class="bday-preview" id="bdayPreview"></p>

          <p class="bday-count" id="bdayCount"></p>

          <div class="bday-list" id="bdayList"></div>

          <div class="bday-empty hidden" id="bdayEmpty">
            <span class="bday-empty-emoji" aria-hidden="true">🎂</span>
            <p>هنوز تولدی اضافه نشده.<br />اولین تولد رو اضافه کن!</p>
          </div>
        </section>
      </section>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="app-footer">
      <button class="todo-btn" id="todoLink" type="button">
        <span class="todo-btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2 1 4 1 2-1 4-1 2 1 4 1 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>
        </span>
        <span class="todo-btn-label" id="todoLinkLabel">تولدها</span>
      </button>
      <a
        class="github-btn"
        id="githubLink"
        href="https://github.com/houtan17/Mood-tracker"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </footer>

    <!-- ===== Bottom Navigation Bar (mobile) =====
       Icons: inline stroke SVGs (Lucide-style) that inherit
       the item color via currentColor — active-tab highlight
       keeps working without any extra styling. -->
    <nav class="bottom-nav" aria-label="ناوبری اصلی">
      <button type="button" class="nav-item" data-view="birthdays">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2 1 4 1 2-1 4-1 2 1 4 1 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>
        </span>
        <span class="nav-label" id="navBirthdaysLabel">تولدها</span>
      </button>
      <button type="button" class="nav-item" data-view="dashboard">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        </span>
        <span class="nav-label" id="navDashLabel">داشبورد</span>
      </button>
      <button type="button" class="nav-item" data-view="home">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        </span>
        <span class="nav-label" id="navHomeLabel">خانه</span>
      </button>
      <button type="button" class="nav-item" data-view="year">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        </span>
        <span class="nav-label" id="navYearLabel">شمارنده</span>
      </button>
      <button type="button" class="nav-item" data-view="todo">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
        </span>
        <span class="nav-label" id="navTodoLabel">کارها</span>
      </button>
    </nav>

    <!-- ===== Day modal ===== -->
    <div class="modal-overlay hidden" id="modalOverlay">
      <div class="card modal-card">
        <button class="modal-close" id="closeModalBtn" aria-label="close">
          ×
        </button>
        <h3 class="modal-date" id="modalDateTitle"></h3>
        <div class="mood-picker" id="moodPicker"></div>
        <textarea class="note-input" id="noteInput"></textarea>
        <div class="modal-actions">
          <button class="btn btn-danger-ghost" id="deleteEntryBtn">
            حذف روز
          </button>
          <button class="btn btn-primary" id="saveEntryBtn">ذخیره</button>
        </div>
      </div>
    </div>

    <!-- ===== Name dialog (first visit / rename) ===== -->
    <div class="modal-overlay hidden" id="welcomeOverlay">
      <div class="card modal-card">
        <h3 class="modal-date" id="welcomeTitle"></h3>
        <input type="text" class="name-input" id="nameInput" maxlength="30" />
        <div class="modal-actions">
          <button class="btn btn-ghost" id="cancelNameBtn">انصراف</button>
          <button class="btn btn-primary" id="saveNameBtn">شروع کنیم</button>
        </div>
      </div>
    </div>

    <!-- ===== Auth modal (login / signup / change password) ===== -->
    <div class="modal-overlay hidden" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="card modal-card auth-card">
        <button class="modal-close" id="closeAuthBtn" aria-label="close">×</button>
        <h3 class="auth-title" id="authTitle">ورود به حساب</h3>

        <div class="auth-tabs" id="authTabs">
          <button type="button" class="auth-tab active" id="authTabLogin">ورود</button>
          <button type="button" class="auth-tab" id="authTabSignup">ثبت‌نام</button>
        </div>

        <form id="authForm" novalidate>
          <label class="auth-field">
            <span class="auth-label" id="authEmailLabel">ایمیل</span>
            <input type="email" class="auth-input" id="authEmail" placeholder="you@example.com" autocomplete="email" dir="ltr" />
          </label>
          <label class="auth-field">
            <span class="auth-label" id="authPassLabel">رمز عبور</span>
            <span class="auth-pass-wrap">
              <input type="password" class="auth-input" id="authPass" autocomplete="current-password" dir="ltr" />
              <button type="button" class="auth-pass-toggle" id="authPassToggle" aria-label="show password">👁</button>
            </span>
          </label>
          <p class="auth-hint" id="authPassHint"></p>
          <button type="button" class="auth-link" id="authForgotBtn">فراموشی رمز عبور؟</button>
          <button type="submit" class="btn btn-primary auth-submit" id="authSubmitBtn">ورود</button>
        </form>

        <form id="authResetForm" class="hidden" novalidate>
          <label class="auth-field">
            <span class="auth-label" id="authNewPassLabel">رمز عبور جدید</span>
            <input type="password" class="auth-input" id="authNewPass" autocomplete="new-password" dir="ltr" />
          </label>
          <button type="submit" class="btn btn-primary auth-submit" id="authResetSubmitBtn">ذخیره رمز جدید</button>
        </form>

        <p class="auth-error hidden" id="authError" role="alert"></p>

        <p class="auth-hint" id="authHint" style="margin-top: 10px;"></p>

        <div class="auth-divider" id="authDivider"><span id="authOrLabel">یا</span></div>
        <button type="button" class="auth-google-btn" id="authGoogleBtn">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
          <span id="authGoogleLabel">ادامه با گوگل</span>
        </button>
      </div>
    </div>

    <!-- ===== Toast holder ===== -->
    <div class="toast-holder" id="toastHolder"></div>

    <!-- Scripts: order matters (supabase vendor + config first;
         sync/auth before app.js so App.init can talk to them) -->
    <script src="js/vendor/supabase.js"></script>
    <script src="js/jalali.js"></script>
    <script src="js/moods.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/streak.js"></script>
