<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت حال روزانه</title>

    <!-- ===== PWA ===== -->
    <link rel="manifest" href="manifest.json" />

    <!-- Browser UI color (matches --primary in variables.css) -->
    <meta name="theme-color" content="#5b7cfa" />

    <!-- iOS: install as standalone app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="حال روزانه" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Generic favicon (reuses the PWA icon) -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />

    <!-- Font (falls back to system fonts when offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Styles: order matters (variables first) -->
    <!-- Apply saved/auto theme before first paint (no flash) -->
    <script>
      (function () {
        var theme = "light";
        try {
          var data = JSON.parse(localStorage.getItem("moodTracker.v1") || "{}");
          var mode = data && data.settings && data.settings.theme;
          if (mode === "light" || mode === "dark") {
            theme = mode;
          } else {
            var h = new Date().getHours();
            theme = h >= 6 && h < 18 ? "light" : "dark"; // sunset estimate
          }
        } catch (e) {
          /* keep light */
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CWVQMFX1BG"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-CWVQMFX1BG");
    </script>
  </head>
  <body>
    <!-- ===== Header ===== -->
    <header class="app-header">
      <div class="header-inner">
        <button class="greet-btn hidden" id="greetBtn">
          <span id="greetText"></span>
        </button>
        <h1 class="app-title" id="appTitle">ثبت حال روزانه</h1>
        <div class="header-actions">
          <button class="btn btn-ghost icon-btn" id="themeToggle">🌓</button>
          <button class="btn btn-ghost" id="exportBtn">پشتیبان‌گیری</button>
          <button class="btn btn-ghost" id="importBtn">بازیابی</button>
          <input
            type="file"
            id="importFileInput"
            accept="application/json,.json"
            hidden
          />
          <button class="btn btn-ghost" id="langToggle">EN</button>
        </div>
      </div>
    </header>

    <!-- ===== Main ===== -->
    <main class="container">
      <section class="card">
        <div class="calendar-header">
          <button class="nav-btn" id="prevMonthBtn" aria-label="prev">‹</button>
          <h2 class="month-title" id="monthTitle"></h2>
          <button class="nav-btn" id="nextMonthBtn" aria-label="next">›</button>
        </div>

        <div
          style="display: flex; justify-content: center; margin-bottom: 12px"
        >
          <button class="btn btn-primary today-btn" id="todayBtn">امروز</button>
        </div>

        <div class="weekday-row" id="weekdayRow"></div>
        <div class="days-grid" id="daysGrid"></div>

        <div class="mood-legend" id="moodLegend"></div>
      </section>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="app-footer">
      <a class="todo-btn" id="todoLink" href="todo.html">
        <span class="todo-btn-icon" aria-hidden="true">✅</span>
        <span class="todo-btn-label" id="todoLinkLabel">لیست کارها</span>
      </a>
      <a
        class="github-btn"
        id="githubLink"
        href="https://github.com/houtan17/Mood-tracker"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </footer>

    <!-- ===== Day modal ===== -->
    <div class="modal-overlay hidden" id="modalOverlay">
      <div class="card modal-card">
        <button class="modal-close" id="closeModalBtn" aria-label="close">
          ×
        </button>
        <h3 class="modal-date" id="modalDateTitle"></h3>
        <div class="mood-picker" id="moodPicker"></div>
        <textarea class="note-input" id="noteInput"></textarea>
        <div class="modal-actions">
          <button class="btn btn-danger-ghost" id="deleteEntryBtn">
            حذف روز
          </button>
          <button class="btn btn-primary" id="saveEntryBtn">ذخیره</button>
        </div>
      </div>
    </div>

    <!-- ===== Name dialog (first visit / rename) ===== -->
    <div class="modal-overlay hidden" id="welcomeOverlay">
      <div class="card modal-card">
        <h3 class="modal-date" id="welcomeTitle"></h3>
        <input type="text" class="name-input" id="nameInput" maxlength="30" />
        <div class="modal-actions">
          <button class="btn btn-ghost" id="cancelNameBtn">انصراف</button>
          <button class="btn btn-primary" id="saveNameBtn">شروع کنیم</button>
        </div>
      </div>
    </div>

    <!-- ===== Toast holder ===== -->
    <div class="toast-holder" id="toastHolder"></div>

    <!-- Scripts: order matters -->
    <script src="js/jalali.js"></script>
    <script src="js/moods.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>

    <!-- ===== PWA: register the service worker + update toast ===== -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("sw.js")
            .then((reg) => {
              reg.addEventListener("updatefound", () => {
                var nw = reg.installing;
                if (!nw) return;
                nw.addEventListener("statechange", () => {
                  /* Announce only when a NEW version takes over an
                     already-controlled page (not on first install) */
                  if (
                    nw.state === "activated" &&
                    navigator.serviceWorker.controller
                  ) {
                    showUpdateToast();
                  }
                });
              });
            })
            .catch((err) =>
              console.error("Service Worker registration failed:", err),
            );
        });
      }

      function showUpdateToast() {
        var holder = document.getElementById("toastHolder");
        if (!holder) return;
        holder.innerHTML = "";
        var box = document.createElement("div");
        box.className = "toast-box";
        box.textContent = "به‌روزرسانی جدید نصب شد ✨";
        holder.appendChild(box);
      }
    </script>
  </body>
</html>
